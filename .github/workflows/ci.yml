name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip install flask
      - run: python -m unittest discover -s saslite_custom -p 'test_*.py' -v
      - run: python saslite_custom/build_wheel.py
      - run: python -m twine check dist/*
      - name: Verify installed wheel outside source checkout
        run: |
          python -m venv /tmp/saslite-wheel
          /tmp/saslite-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/saslite-wheel/bin/saslite-custom help
          /tmp/saslite-wheel/bin/saslite-custom -e 'data demo; x=42; run; proc print data=demo; run;'
          mkdir -p /tmp/saslite-graphics-smoke
          cp "$GITHUB_WORKSPACE/examples/graphics.sas" /tmp/saslite-graphics-smoke/
          /tmp/saslite-wheel/bin/saslite-custom /tmp/saslite-graphics-smoke/graphics.sas
          /tmp/saslite-wheel/bin/python -c 'from pathlib import Path; from PIL import Image; images=list(Path("/tmp/saslite-graphics-smoke/graphs").glob("*.png")); assert len(images)==3; [Image.open(p).verify() for p in images]'
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-python-${{ matrix.python }}
          path: dist/*
